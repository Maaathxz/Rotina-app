name: Gerar APK Minha Rotina

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -o MinhaRotinaAndroid_CloudBuild.zip
          cd MinhaRotinaAndroid
          echo "Projeto extraído"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: MinhaRotinaAndroid
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaRotina-APK
          path: MinhaRotinaAndroid/app/build/outputs/apk/debug/app-debug.apk
