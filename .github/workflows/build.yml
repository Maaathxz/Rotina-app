name: Build Minha Rotina APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -o MinhaRotinaAndroid_V3_FINAL.zip -d .

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Compilar APK
        run: |
          cd MinhaRotinaAndroid
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaRotina-v3-debug-apk
          path: MinhaRotinaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
