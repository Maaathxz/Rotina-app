name: Build Minha Rotina APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Encontrar e extrair ZIP mais novo
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado na raiz."
            exit 1
          fi

          echo "ZIP usado: $ZIP"
          unzip -o "$ZIP" -d .

      - name: Verificar estrutura
        shell: bash
        run: |
          ls -la MinhaRotinaAndroid
          ls -l MinhaRotinaAndroid/settings.gradle

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        shell: bash
        run: |
          cd MinhaRotinaAndroid
          gradle assembleDebug --stacktrace

      - name: Guardar APK (artifact, vem em ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: MinhaRotina-debug-apk
          path: MinhaRotinaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK em Releases (baixa direto, sem ZIP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minha Rotina - build ${{ github.run_number }}
          files: MinhaRotinaAndroid/app/build/outputs/apk/debug/app-debug.apk
          
